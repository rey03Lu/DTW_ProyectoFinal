<!-- Formulario para que showTareas use por medio de JS -->
<div class="form-group">
    <!-- Campo del titulo -->
    <label for="titulo"><strong>Título:</strong></label>
    <p id="titulo-tarea" class="form-control-plaintext"></p>
</div>
<!-- Descripción, no aparece en index, unicamente cuando se desea ver la tarea -->
<div class="form-group">
    <label for="descripcion"><strong>Descripción:</strong></label>
    <p id="descripcion-tarea" class="form-control-plaintext"></p>
</div>
<!-- Estado pendiente o completada -->
<div class="form-group">
    <label for="estado"><strong>Estado:</strong></label>
    <p id="estado-tarea" class="form-control-plaintext"></p>
</div>
